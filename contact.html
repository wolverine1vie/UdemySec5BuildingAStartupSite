<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Mountain Travel</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="tours-page">

    <header>
        <h2><a href="index.html">Mountain Travel</a></h2>

        <nav>
            <ul>
                <li><a href="tours.html">Tours</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
<section class="page-hero">
    <h1>Contact Us</h1>
    <p>
        Your next mountain adventure starts here.
        Have questions about our destinations?
        We'd love to hear from you!
    </p>
</section>
    <section class="contact">
        <h1>Contact Us</h1>
        <p>Do you have any questions? Get in touch with us!</p>
        <form id="contact-form">
            <input type="text" name="name" placeholder="Your name" required>        
            <input type="email" name="email" placeholder="Your email" required>        
            <textarea name="message" placeholder="Your message" required></textarea>        
            <button class="btn" type="submit">Send Message</button>
        </form>
        <p id="form-status"></p>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@5/dist/email.min.js"></script>
    
    <script>
        emailjs.init({
            publicKey: "kaN0PXg3kGMMMC3Vc"
        });
    
        document.getElementById("contact-form").addEventListener("submit", function(event) {
            event.preventDefault();
    
            const status = document.getElementById("form-status");
            const button = this.querySelector("button");
    
            button.disabled = true;
            status.textContent = "Sending message...";
    
            emailjs.sendForm(
                "service_mitdjs8",
                "template_l7lbiwr",
                this
            ).then(function() {
                status.textContent = "Message sent successfully!";
                document.getElementById("contact-form").reset();
                button.disabled = false;
            }).catch(function(error) {
                status.textContent = "Sorry, the message could not be sent. Please try again.";
                console.error("EmailJS error:", error);
                button.disabled = false;
            });
        });
    </script>
</body>
</html>
